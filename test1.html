<!DOCTYPE html>
<html>
<head>
    <title>تمرین روز اول</title>
</head>
<body>

    <h1>سلام! من ارین هستم</h1>
    
    <h2>درباره من</h2>
    <p>من ۱۶ سال دارم و دانش آموز هستم.</p>
    <p>دارم برنامه نویسی وب یاد میگیرم.</p>
    
    <h2>علاقه‌مندی‌های من</h2>
    <p>برنامه نویسی، کتاب خواندن، ورزش</p>

</body>
</html>
