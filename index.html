<!DOCTYPE html>
<html>

<head>
    <title>ArYaN-Troll</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 35px 25px 30px 25px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #667eea;
        }

        .name {
            font-size: 26px;
            font-weight: bold;
            color: #333;
            margin: 0;
        }

        .title {
            font-size: 16px;
            color: #667eea;
            margin: 5px 0 15px 0;
            font-weight: 500;
        }

        .bio {
            font-size: 14px;
            color: #777;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .social-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 12px;
            border-radius: 50px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 15px;
            transition: all 0.3s;
        }

        .social-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .instagram {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
        }

        .telegram {
            background: #0088cc;
        }

        .channel {
            background: #2aabee;
        }

        .contact-btn {
            display: block;
            margin-top: 20px;
            background: #667eea;
            color: white;
            padding: 12px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3;
        }

        .contact-btn:hover {
            background: #5a67d8;
            transform: scale(1.02);
        }

        .icon {
            font-size: 22px;
        }

        @media (max-width: 480px) {
            .card {
                padding: 25px 15px 20px 15px;
            }

            .profile-img {
                width: 100px;
                height: 100px;
            }

            .name {
                font-size: 22px;
            }

            .title {
                font-size: 14px;
            }

            .bio {
                font-size: 13px;
            }

            .social-btn {
                font-size: 13px;
                padding: 10px;
            }

            .contact-btn {
                font-size: 14px;
                padding: 10px;
            }
        }
    </style>
</head>

<body>
    
    <div class="card">

        <img class="profile-img" src="IMG_20260616_201541_576.webp" alt="عکس">

        <h1 class="name">ArYaN-Troll</h1>

        <p class="title">توسعه دهنده بدافزار👨‍💻</p>

        <p class="bio">hello friend , hello friend</p>

        <div class="social-links">

            <a href="https://www.instagram.com/aryan.mh19?igsh=eXRneXY0aDcyNms=" class="social-btn instagram">
                <span class="icon">اینستاگرامم</span>
            </a>

            <a href="https://t.me/ghanongar" class="social-btn telegram">
                <span class="icon">تلگرامم</span>
            </a>

            <a href="https://t.me/aryan_mh901" class="social-btn channel">
                <span class="icon">چنل تلگرامم</span>
            </a>
        </div>

        <a href="#" class="contact-btn">تماس با من</a>
    </div>
</body>
</html>
