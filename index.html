<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fsociety | ArYaN Troll</title>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Share Tech Mono', monospace;
    background:#000;
    color:#fff;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

/* background glow */
.background{
    position:fixed;
    width:100%;
    height:100%;
    background:radial-gradient(circle at top left, rgba(0,255,136,.15), transparent 40%);
    z-index:-1;
}

.container{
    width:90%;
    max-width:700px;
    padding:40px;
    text-align:center;

    background:rgba(255,255,255,0.03);
    border:1px solid rgba(0,255,136,0.2);
    border-radius:20px;

    box-shadow:0 0 30px rgba(0,255,136,0.1);
}

.logo{
    font-size:4rem;
}

.f{
    color:#00ff88;
    text-shadow:0 0 15px #00ff88;
}

.name{
    margin-top:10px;
    color:#aaa;
}

#typing{
    margin:20px 0;
    color:#00ff88;
    min-height:20px;
}

.links{
    display:flex;
    flex-direction:column;
    gap:15px;
    margin-top:25px;
}

.links a{
    text-decoration:none;
    color:#fff;
    border:1px solid #00ff88;
    padding:14px;
    border-radius:10px;
    transition:0.3s;
}

.links a:hover{
    background:#00ff88;
    color:#000;
    transform:scale(1.03);
}

.footer{
    margin-top:25px;
    font-size:0.8rem;
    color:#666;
}

/* mobile */
@media(max-width:600px){
    .logo{
        font-size:2.8rem;
    }

    .container{
        padding:25px;
    }
}
</style>
</head>

<body>

<div class="background"></div>

<div class="container">

    <h1 class="logo">
        <span class="f">F</span>society
    </h1>

    <h2 class="name">ArYaN Troll</h2>

    <p id="typing"></p>

    <div class="links">

        <a href="https://www.instagram.com/aryan.mh19?igsh=eXRneXY0aDcyNms=" target="_blank">Instagram</a>
        <a href="https://t.me/ArYaN_MH191" target="_blank">Telegram</a>
        <a href="YOUR_GITHUB_LINK" target="_blank">GitHub</a>
        <a href="https://t.me/aryan_mh901" target="_blank">Telegram Channel</a>
        <a href="mailto:YOUR_EMAIL">Email</a>

    </div>

    <div class="footer">
        We Are Fsociety
    </div>

</div>

<script>
    const text = "Hello Friend. Welcome to Fsociety.";

let i = 0;
const typing = document.getElementById("typing");

function typeWriter(){
    if(i < text.length){
        typing.innerHTML += text.charAt(i);
        i++;
        setTimeout(typeWriter, 80);
    }
}

typeWriter();
</script>

</body>
</html>
